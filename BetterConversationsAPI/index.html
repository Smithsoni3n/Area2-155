<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Better Conversations Protocol Deck — Z Flip Mock</title>
  <style>
    :root {
      --foil: linear-gradient(135deg,#c0c6d4 0%,#ffd166 20%,#75ffa2 40%,#ff9ce6 60%,#b589ff 80%,#66b8ff 100%);
      --silver: linear-gradient(135deg,#f4f7fb 0%,#c0c6d4 100%);
      --gold: linear-gradient(135deg,#fbe18f 0%,#f6b73c 100%);
      --green: linear-gradient(135deg,#90f9c4 0%,#0edb8f 100%);
      --pink: linear-gradient(135deg,#ffd0f3 0%,#ff6fb1 100%);
      --purple: linear-gradient(135deg,#d9c7ff 0%,#9f6bff 100%);
      --blue: linear-gradient(135deg,#c7e9ff 0%,#4db3ff 100%);
      --shell-top:#0b2431;
      --shell-bottom:#0ea3b1;
      --text:#03111d;
      --bg:#04121f;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(160deg, rgba(9,45,65,0.94) 0%, rgba(6,25,38,0.96) 40%, rgba(5,17,27,1) 100%);
      color:var(--text);
      font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      padding:40px 18px 48px;
    }
    .wrap{
      text-align:center;
      display:flex;
      flex-direction:column;
      gap:14px;
      max-width:420px;
      width:100%;
    }
    h1{margin:0;font-size:26px;font-weight:900;letter-spacing:0.4px;color:#f5fbff;text-shadow:0 12px 36px rgba(0,0,0,0.55);}
    .phone{
      position:relative;
      width:344px;
      max-width:100%;
      margin:0 auto;
      padding:14px;
      border-radius:28px;
      background:linear-gradient(180deg,var(--shell-top),var(--shell-bottom));
      box-shadow:0 20px 46px rgba(0,0,0,0.55),0 0 0 1px rgba(255,255,255,0.08);
    }
    .screen{
      position:relative;
      background:linear-gradient(135deg, rgba(7,24,35,0.95), rgba(8,46,60,0.92)), linear-gradient(25deg, rgba(102,184,255,0.22), rgba(14,154,167,0.18));
      border-radius:22px;
      padding:18px 16px 80px;
      overflow:hidden;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,0.12), 0 22px 58px rgba(0,0,0,0.62);
      min-height:640px;
    }
    #cardImg{
      width:100%;
      border-radius:18px;
      display:block;
      height:auto;
      max-height:552px;
      object-fit:contain;
      margin-bottom:12px;
      box-shadow:0 16px 38px rgba(0,0,0,0.64);
      background:linear-gradient(120deg, rgba(255,255,255,0.08), transparent 50%),
                 linear-gradient(300deg, rgba(0,154,167,0.18), transparent 55%);
      padding:16px;
    }
    .controls{
      position:absolute;
      left:50%;
      bottom:12px;
      transform:translateX(-50%);
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:center;
      padding:14px 16px;
      background:linear-gradient(135deg, rgba(0,10,16,0.9), rgba(1,16,26,0.88));
      border-radius:18px;
      backdrop-filter:blur(14px);
      box-shadow:0 16px 34px rgba(0,0,0,0.52);
      border:1px solid rgba(255,255,255,0.32);
      outline:1px solid rgba(0,0,0,0.28);
      outline-offset:-4px;
    }
    .foil-btn{
      border:0;
      border-radius:999px;
      padding:12px 20px;
      font-weight:900;
      font-size:15px;
      color:#041021;
      letter-spacing:0.45px;
      cursor:pointer;
      box-shadow:0 10px 28px rgba(0,0,0,0.42),0 0 0 1px rgba(255,255,255,0.35);
      transition:transform 0.15s ease,box-shadow 0.15s ease;
      text-transform:uppercase;
      min-width:92px;
    }
    .foil-btn:active{transform:translateY(1px);box-shadow:0 6px 18px rgba(0,0,0,0.36);}
    .new-action{background:linear-gradient(135deg,#f4f7fb 0%,#c0c6d4 30%,#c7e9ff 70%,#4db3ff 100%);}
    .flip-action{background:linear-gradient(135deg,#fbe18f 0%,#f6b73c 34%,#ffd0f3 66%,#ff6fb1 100%);}
    .back-action{background:linear-gradient(135deg,#90f9c4 0%,#0edb8f 40%,#d9c7ff 74%,#9f6bff 100%);}
    .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px;color:#cdefff;font-weight:700;letter-spacing:0.2px;}
    .meta span{display:block;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);text-align:left;}
    .hint{font-size:15px;color:#c3edf9;font-weight:800;letter-spacing:0.32px;line-height:1.6;}
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="deckTitle">Better Conversations Protocol Deck</h1>
    <div class="phone" aria-label="Teal Z Flip mockup">
      <div class="screen">
        <img id="cardImg" src="" alt="Card" decoding="async" loading="lazy" />
        <div class="controls" role="toolbar" aria-label="Card controls">
          <button id="backBtn" class="foil-btn back-action" title="Previous card">Back</button>
          <button id="flipBtn" class="foil-btn flip-action" title="Flip the card">Flip</button>
          <button id="newBtn" class="foil-btn new-action" title="Next card">New</button>
        </div>
      </div>
    </div>
    <div class="meta" aria-live="polite">
      <span id="cardMeta">Card 1 of 12 — Front</span>
      <span id="colorMeta">Color track: Crimson Red</span>
    </div>
    <div class="hint">Front shows your exact problems; Flip reveals the matching protocols and links. Foil buttons glow silver,
 gold, green, pink, purple, and blue.</div>
  </div>

<script>
const cardImg = document.getElementById('cardImg');
const flipBtn = document.getElementById('flipBtn');
const newBtn = document.getElementById('newBtn');
const backBtn = document.getElementById('backBtn');
const deckTitle = document.getElementById('deckTitle');
const cardMeta = document.getElementById('cardMeta');
const colorMeta = document.getElementById('colorMeta');

// Absolute API base for GitHub Pages calling Vercel; override by setting window.API_BASE
const API_BASE = window.API_BASE
  || (location.hostname.includes('vercel.app') ? `${location.protocol}//${location.host}` : 'https://area2-155.vercel.app');

let deckSize = 12;
let currentId = 1;
let showingBack = false;
let failedOnce = false;
let deckData = [];

const fallbackSvg = encodeURIComponent(`<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="396" height="866" viewBox="0 0 396 866" role="img" aria-label="Card unavailable">
  <defs>
    <linearGradient id="foil" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#c0c6d4"/>
      <stop offset="22%" stop-color="#ffd166"/>
      <stop offset="45%" stop-color="#75ffa2"/>
      <stop offset="65%" stop-color="#ff9ce6"/>
      <stop offset="82%" stop-color="#b589ff"/>
      <stop offset="100%" stop-color="#66b8ff"/>
    </linearGradient>
    <linearGradient id="tealShell" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f2f34"/>
      <stop offset="100%" stop-color="#0e9aa7"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="42" ry="42" fill="url(#tealShell)"/>
  <g transform="translate(18,18)">
    <rect width="360" height="830" rx="24" ry="24" fill="#02060a" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
    <rect x="18" y="18" width="324" height="746" rx="18" ry="18" fill="url(#foil)"/>
    <text x="46" y="120" font-family="'Inter',system-ui,-apple-system,Roboto,Arial" font-weight="900" font-size="22" fill="#061024">Card not loading</text>
    <text x="46" y="160" font-family="'Inter',system-ui,-apple-system,Roboto,Arial" font-weight="700" font-size="16" fill="#041422">Check the /api/card route and try again.</text>
  </g>
</svg>`);

cardImg.src = `data:image/svg+xml,${fallbackSvg}`;

function updateMeta() {
  const sideLabel = showingBack ? 'Back' : 'Front';
  const deckColor = (deckData[currentId - 1] && (deckData[currentId - 1].front.color || deckData[currentId - 1].front.tags?.[1])) || 'Foil';
  cardMeta.textContent = `Card ${currentId} of ${deckSize} — ${sideLabel}`;
  colorMeta.textContent = `Color track: ${deckColor}`;
}

async function setImgUrl() {
  const url = new URL('/api/card', API_BASE);
  url.searchParams.set('id', currentId);
  url.searchParams.set('side', showingBack ? 'back' : 'front');
  url.searchParams.set('_cb', Date.now());
  cardImg.setAttribute('aria-busy', 'true');
  cardImg.alt = showingBack ? 'Card back' : 'Card front';

  try {
    const resp = await fetch(url.toString(), { cache: 'no-store' });
    if (!resp.ok) throw new Error(`status ${resp.status}`);
    const text = await resp.text();
    const dataUrl = `data:image/svg+xml;utf8,${encodeURIComponent(text)}`;
    cardImg.src = dataUrl;
  } catch (err) {
    console.warn('Image load failed, swapping to placeholder', err && err.message ? err.message : err);
    cardImg.src = `data:image/svg+xml,${fallbackSvg}`;
    cardImg.removeAttribute('aria-busy');
  }
  updateMeta();
}

async function loadMeta() {
  try {
    const r = await fetch(`${API_BASE}/api/card?format=json`);
    if (!r.ok) return;
    const j = await r.json();
    deckData = j.v2 || [];
    deckSize = deckData.length || deckSize;
    deckTitle.textContent = j.deckName || deckTitle.textContent;
    updateMeta();
  } catch (e) {
    console.warn('Meta load failed', e);
  }
}

newBtn.addEventListener('click', () => {
  currentId = currentId % deckSize + 1;
  showingBack = false;
  setImgUrl();
});

backBtn.addEventListener('click', () => {
  currentId = currentId === 1 ? deckSize : currentId - 1;
  showingBack = false;
  setImgUrl();
});

flipBtn.addEventListener('click', () => {
  showingBack = !showingBack;
  setImgUrl();
});

cardImg.addEventListener('error', () => {
  failedOnce = true;
  cardImg.src = `data:image/svg+xml,${fallbackSvg}`;
  cardImg.removeAttribute('aria-busy');
});

cardImg.addEventListener('load', () => {
  cardImg.removeAttribute('aria-busy');
  failedOnce = false;
});

loadMeta();
setImgUrl();
</script>
</body>
</html>
