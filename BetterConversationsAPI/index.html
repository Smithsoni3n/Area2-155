<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Better Conversations — Quick Preview</title>
</head>
<body>
  <main>
    <h1>Better Conversations — Live Card Preview</h1>

    <!-- Image loads from the serverless endpoint. No CSS file; minimal layout only. -->
    <div>
      <img id="cardImg" src="/api/card" alt="Study card" style="max-width:360px;display:block;margin:12px 0;">
    </div>

    <!-- Buttons do useful actions only: New = new random card; Flip = show evidence/back; JSON = list cards -->
    <div>
      <button id="newBtn">New</button>
      <button id="flipBtn">Flip</button>
      <button id="listBtn">Show JSON list</button>
    </div>

    <!-- Simple area to show JSON list or messages -->
    <pre id="out" style="white-space:pre-wrap;margin-top:12px"></pre>
  </main>

<script>
  // Minimal client JS (no CSS). Uses the single endpoint /api/card:
  // - GET /api/card -> random SVG (front)
  // - GET /api/card?id=3 -> SVG for card 3 (front)
  // - GET /api/card?side=back&id=3 -> SVG for back/evidence
  // - GET /api/card?format=json -> JSON list of cards

  const cardImg = document.getElementById('cardImg');
  const newBtn = document.getElementById('newBtn');
  const flipBtn = document.getElementById('flipBtn');
  const listBtn = document.getElementById('listBtn');
  const out = document.getElementById('out');

  let showingBack = false;
  let currentId = null;

  function setImgUrl(params = {}) {
    const url = new URL('/api/card', window.location.origin);
    Object.entries(params).forEach(([k,v]) => { if (v !== undefined && v !== null) url.searchParams.set(k, v); });
    // add cache-buster for "New" action
    url.searchParams.set('_cb', Date.now());
    cardImg.src = url.toString();
  }

  // New random card
  newBtn.addEventListener('click', () => {
    showingBack = false;
    currentId = null;
    setImgUrl(); // random front
    out.textContent = '';
  });

  // Flip between front and back for current card; if none chosen, flip the current loaded image by asking server for a random back
  flipBtn.addEventListener('click', async () => {
    showingBack = !showingBack;
    const side = showingBack ? 'back' : 'front';
    // If we have currentId, request the same card's back/front. Otherwise request just side.
    const params = {};
    if (currentId) params.id = currentId;
    params.side = side;
    setImgUrl(params);
    out.textContent = '';
  });

  // Get JSON list of cards (uses the same single endpoint with format=json)
  listBtn.addEventListener('click', async () => {
    out.textContent = 'Loading JSON list…';
    try {
      const r = await fetch('/api/card?format=json');
      if (!r.ok) throw new Error('Network error');
      const j = await r.json();
      // For quick selection show indexes and titles; also allow clicking a number to load that card
      const list = (j.v2 || j.v1 || []).map((c,i) => `${i+1}. ${c.front.title}`).join('\n');
      out.textContent = list || JSON.stringify(j, null, 2);
    } catch (e) {
      out.textContent = 'Error fetching list: ' + e;
    }
  });

  // initial random
  setImgUrl();
</script>
</body>
</html>
