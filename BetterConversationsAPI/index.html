<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Better Conversations — Live Card Preview</title>
  <style>
    /* Minimal layout tuned for an iPhone-sized card preview */
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; margin: 18px; color:#071124 }
    h1 { font-size:20px; margin:0 0 18px }
    .container { max-width:920px }
    .card-wrap { display:inline-block; position:relative; border-radius:20px; background:transparent }
    /* iPhone-width preview */
    #cardImg { width:360px; height:auto; display:block; border-radius:22px; box-shadow: 0 8px 28px rgba(2,6,18,0.28) }
    .controls { margin-top:12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap }
    button { padding:8px 10px; border-radius:8px; border:1px solid #aaa; background:#fff; cursor:pointer; font-weight:700 }
    label { font-size:14px; margin-left:8px }
    pre#out { background:#fafafa; padding:8px; border-radius:8px; margin-top:12px; max-width:760px; white-space:pre-wrap }
    ul#jsonList { margin:8px 0 0; padding-left:20px }
    ul#jsonList li { cursor:pointer; color:#0b63cc; text-decoration:underline; margin-bottom:6px }
    /* small non-interactive badge overlay so the preview mirrors the svg badge position */
    .overlay-badge { position:absolute; right:36px; bottom:86px; pointer-events:none; font-weight:900; background:transparent; color:#061024 }
    @media (max-width:420px){ #cardImg { width:92vw } }
  </style>
</head>
<body>
  <main class="container">
    <h1>Better Conversations — Live Card Preview</h1>

    <div class="card-wrap" id="cardWrap" aria-live="polite">
      <!-- The SVG comes from the serverless route. It is an image (non-interactive),
           so buttons below request new SVGs (front/back) from the API. -->
      <img id="cardImg" src="/api/card" alt="Study card preview (iPhone portrait)"/>
      <div class="overlay-badge" id="overlayBadge" aria-hidden="true"></div>
    </div>

    <div class="controls" role="toolbar" aria-label="Card controls">
      <button id="newBtn" type="button">New</button>
      <button id="flipBtn" type="button">Flip</button>
      <button id="listBtn" type="button">Show JSON list</button>
      <label>Go to id:
        <input id="gotoInput" type="number" min="1" style="width:64px;margin-left:6px" />
      </label>
      <button id="gotoBtn" type="button">Load</button>
    </div>

    <pre id="out" style="display:none"></pre>
    <ul id="jsonList" style="display:none" aria-hidden="true"></ul>
  </main>

<script>
const cardImg = document.getElementById('cardImg');
const newBtn = document.getElementById('newBtn');
const flipBtn = document.getElementById('flipBtn');
const listBtn = document.getElementById('listBtn');
const out = document.getElementById('out');
const jsonList = document.getElementById('jsonList');
const overlayBadge = document.getElementById('overlayBadge');
const gotoInput = document.getElementById('gotoInput');
const gotoBtn = document.getElementById('gotoBtn');

let showingBack = false;
let currentId = null;

function setImgUrl(params = {}) {
  const url = new URL('/api/card', window.location.origin);
  if (params.id) { url.searchParams.set('id', params.id); currentId = String(params.id); }
  else if (currentId && params.useCurrent !== false) { url.searchParams.set('id', currentId); }
  if (params.side) { url.searchParams.set('side', params.side); showingBack = params.side === 'back'; }
  else { url.searchParams.set('side', showingBack ? 'back' : 'front'); }
  if (params.cacheBuster !== false) url.searchParams.set('_cb', Date.now());
  cardImg.src = url.toString();
  overlayBadge.textContent = currentId ? `${currentId}/` : '';
}

// New random card
newBtn.addEventListener('click', () => {
  showingBack = false;
  currentId = null;
  const url = new URL('/api/card', window.location.origin);
  url.searchParams.set('_cb', Date.now());
  url.searchParams.set('side', 'front');
  cardImg.src = url.toString();
  overlayBadge.textContent = '';
  out.style.display='none'; jsonList.style.display='none';
});

// Flip
flipBtn.addEventListener('click', () => {
  showingBack = !showingBack;
  const side = showingBack ? 'back' : 'front';
  setImgUrl({ side });
  out.style.display='none'; jsonList.style.display='none';
});

// List JSON
listBtn.addEventListener('click', async () => {
  out.style.display='block'; out.textContent='Loading list…';
  try {
    const r = await fetch('/api/card?format=json');
    if(!r.ok) throw new Error('Network error: ' + r.status);
    const j = await r.json();
    const arr = j.v2 || j.v1 || [];
    jsonList.innerHTML = '';
    arr.forEach((c,i)=> {
      const li = document.createElement('li');
      li.textContent = `${i+1}. ${c.front.title}`;
      li.addEventListener('click', ()=> {
        currentId = String(i+1); showingBack = false;
        setImgUrl({ id: currentId, side: 'front' });
        jsonList.style.display='none'; out.style.display='none';
      });
      jsonList.appendChild(li);
    });
    out.textContent = `Click a card number below to load it (total ${arr.length}).`;
    jsonList.style.display='block'; jsonList.setAttribute('aria-hidden','false');
  } catch (e) { out.textContent = 'Error: ' + e; }
});

// Load by typed id
gotoBtn.addEventListener('click', () => {
  const val = parseInt(gotoInput.value,10);
  if(!val || val<1){ alert('Enter a valid card number (1 or greater).'); return; }
  currentId = String(val); showingBack = false;
  setImgUrl({ id: currentId, side: 'front' });
  out.style.display='none'; jsonList.style.display='none';
});

// initial
setImgUrl();
</script>
</body>
</html>
