<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Supercommunicator Protocols — Z Flip Mock</title>
  <style>
    :root {
      --foil: linear-gradient(135deg,#c0c6d4 0%,#ffd166 20%,#75ffa2 40%,#ff9ce6 60%,#b589ff 80%,#66b8ff 100%);
      --silver: linear-gradient(135deg,#f4f7fb 0%,#c0c6d4 100%);
      --gold: linear-gradient(135deg,#fbe18f 0%,#f6b73c 100%);
      --green: linear-gradient(135deg,#90f9c4 0%,#0edb8f 100%);
      --pink: linear-gradient(135deg,#ffd0f3 0%,#ff6fb1 100%);
      --purple: linear-gradient(135deg,#d9c7ff 0%,#9f6bff 100%);
      --blue: linear-gradient(135deg,#c7e9ff 0%,#4db3ff 100%);
      --shell-top:#0f2f34;
      --shell-bottom:#0e9aa7;
      --text:#03111d;
      --bg:#03141e;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:radial-gradient(circle at 20% 20%, rgba(14,154,167,0.24), transparent 32%),
                 radial-gradient(circle at 80% 80%, rgba(102,184,255,0.24), transparent 38%),
                 var(--bg);
      color:var(--text);
      font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      padding:32px 18px 48px;
    }
    .wrap{
      text-align:center;
      display:flex;
      flex-direction:column;
      gap:12px;
      max-width:300px;
      width:100%;
    }
    h1{margin:0;font-size:19px;font-weight:900;letter-spacing:0.2px;color:#e9f6ff;text-shadow:0 4px 18px rgba(0,0,0,0.35);}
    .phone{
      position:relative;
      width:276px;
      max-width:100%;
      margin:0 auto;
      padding:8px;
      border-radius:32px;
      background:linear-gradient(180deg,var(--shell-top),var(--shell-bottom));
      box-shadow:0 14px 40px rgba(0,0,0,0.46),0 0 0 1px rgba(255,255,255,0.08);
    }
    .screen{
      position:relative;
      background:#01060a;
      border-radius:26px;
      padding:8px;
      overflow:hidden;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08);
      min-height:520px;
    }
    #cardImg{
      width:100%;
      border-radius:20px;
      display:block;
      height:auto;
      max-height:450px;
      object-fit:contain;
      margin-bottom:6px;
    }
    .controls{
      position:absolute;
      left:50%;
      bottom:10px;
      transform:translateX(-50%);
      display:flex;
      gap:8px;
      align-items:center;
      justify-content:center;
      padding:7px 9px;
      background:rgba(0,10,16,0.72);
      border-radius:999px;
      backdrop-filter:blur(10px);
      box-shadow:0 12px 26px rgba(0,0,0,0.45);
      border:1px solid rgba(255,255,255,0.28);
      outline:1px solid rgba(0,0,0,0.25);
      outline-offset:-4px;
    }
    .foil-btn{
      border:0;
      border-radius:999px;
      padding:8px 12px;
      font-weight:900;
      font-size:11px;
      color:#041021;
      letter-spacing:0.3px;
      cursor:pointer;
      box-shadow:0 8px 24px rgba(0,0,0,0.36),0 0 0 1px rgba(255,255,255,0.35);
      transition:transform 0.15s ease,box-shadow 0.15s ease;
      text-transform:uppercase;
      min-width:78px;
    }
    .foil-btn:active{transform:translateY(1px);box-shadow:0 4px 14px rgba(0,0,0,0.32);}
    .new-action{background:linear-gradient(135deg,#f4f7fb 0%,#c0c6d4 35%,#c7e9ff 70%,#4db3ff 100%);}
    .flip-action{background:linear-gradient(135deg,#fbe18f 0%,#f6b73c 36%,#ffd0f3 68%,#ff6fb1 100%);}
    .back-action{background:linear-gradient(135deg,#90f9c4 0%,#0edb8f 42%,#d9c7ff 76%,#9f6bff 100%);}
    .hint{font-size:12px;color:#9ec5d6;font-weight:700;letter-spacing:0.2px;line-height:1.4;}
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="deckTitle">Supercommunicator Protocols</h1>
    <div class="phone" aria-label="Teal Z Flip mockup">
      <div class="screen">
        <img id="cardImg" src="/api/card?id=1&side=front" alt="Card" />
        <div class="controls" role="toolbar" aria-label="Card controls">
          <button id="backBtn" class="foil-btn back-action" title="Previous card">Back</button>
          <button id="flipBtn" class="foil-btn flip-action" title="Flip the card">Flip</button>
          <button id="newBtn" class="foil-btn new-action" title="Next card">New</button>
        </div>
      </div>
    </div>
    <div class="hint">Front shows the problem. Flip for the protocol and links. Buttons are foil-toned in silver, gold, green, pink, purple, and blue.</div>
  </div>

<script>
const cardImg = document.getElementById('cardImg');
const flipBtn = document.getElementById('flipBtn');
const newBtn = document.getElementById('newBtn');
const backBtn = document.getElementById('backBtn');
const deckTitle = document.getElementById('deckTitle');

let deckSize = 12;
let currentId = 1;
let showingBack = false;
let failedOnce = false;

const fallbackSvg = encodeURIComponent(`<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="396" height="866" viewBox="0 0 396 866" role="img" aria-label="Card unavailable">
  <defs>
    <linearGradient id="foil" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#c0c6d4"/>
      <stop offset="22%" stop-color="#ffd166"/>
      <stop offset="45%" stop-color="#75ffa2"/>
      <stop offset="65%" stop-color="#ff9ce6"/>
      <stop offset="82%" stop-color="#b589ff"/>
      <stop offset="100%" stop-color="#66b8ff"/>
    </linearGradient>
    <linearGradient id="tealShell" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f2f34"/>
      <stop offset="100%" stop-color="#0e9aa7"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="42" ry="42" fill="url(#tealShell)"/>
  <g transform="translate(18,18)">
    <rect width="360" height="830" rx="32" ry="32" fill="#02060a" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
    <rect x="18" y="18" width="324" height="746" rx="26" ry="26" fill="url(#foil)"/>
    <text x="60" y="120" font-family="'Inter',system-ui,-apple-system,Roboto,Arial" font-weight="900" font-size="22" fill="#061024">Card not loading</text>
    <text x="60" y="160" font-family="'Inter',system-ui,-apple-system,Roboto,Arial" font-weight="700" font-size="16" fill="#041422">Check the /api/card route and try again.</text>
  </g>
</svg>`);

function setImgUrl() {
  const url = new URL(window.location.origin + '/api/card');
  url.searchParams.set('id', currentId);
  url.searchParams.set('side', showingBack ? 'back' : 'front');
  url.searchParams.set('_cb', Date.now());
  cardImg.setAttribute('aria-busy', 'true');
  cardImg.src = url.toString();
  cardImg.alt = showingBack ? 'Card back' : 'Card front';
}

async function loadMeta() {
  try {
    const r = await fetch('/api/card?format=json');
    if (!r.ok) return;
    const j = await r.json();
    deckSize = (j.v2 || []).length || deckSize;
    deckTitle.textContent = j.deckName || deckTitle.textContent;
  } catch (e) {
    console.warn('Meta load failed', e);
  }
}

newBtn.addEventListener('click', () => {
  currentId = currentId % deckSize + 1;
  showingBack = false;
  setImgUrl();
});

backBtn.addEventListener('click', () => {
  currentId = currentId === 1 ? deckSize : currentId - 1;
  showingBack = false;
  setImgUrl();
});

flipBtn.addEventListener('click', () => {
  showingBack = !showingBack;
  setImgUrl();
});

cardImg.addEventListener('error', () => {
  if (failedOnce) return;
  failedOnce = true;
  cardImg.src = `data:image/svg+xml,${fallbackSvg}`;
  cardImg.removeAttribute('aria-busy');
});

cardImg.addEventListener('load', () => {
  cardImg.removeAttribute('aria-busy');
  failedOnce = false;
});

loadMeta();
setImgUrl();
</script>
</body>
</html>
