<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Photo and Video Gallery of Dude the Service Dog">
  <title>Gallery | The Anchor to My Storm</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Video Background -->
  <div class="video-bg">
    <video autoplay muted loop playsinline>
      <source src="background.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="header-inner">
        <a href="index.html" class="logo">
          <i class="fas fa-anchor logo-icon"></i>
          <div class="logo-text">
            <span class="logo-sub">The Anchor</span>
            <span class="logo-main">To My Storm</span>
          </div>
        </a>
        
        <button class="menu-btn" onclick="toggleMenu()">
          <i class="fas fa-bars"></i>
        </button>
        
        <nav class="nav" id="nav">
          <a href="index.html" class="nav-link">Home</a>
          <a href="facts.html" class="nav-link">Facts</a>
          <a href="safety.html" class="nav-link">Safety</a>
          <a href="resources.html" class="nav-link">Resources</a>
          <a href="gallery.html" class="nav-link active">Gallery</a>
          <a href="game.html" class="nav-link"><i class="fas fa-gamepad"></i> Game</a>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <div class="container">
      <!-- Page Header -->
      <div class="page-header">
        <p class="eyebrow">Memories with Dude</p>
        <h1 class="page-title">Photo Gallery</h1>
        <p class="page-intro">A collection of moments that show the bond between a handler and their service dog.</p>
      </div>

      <!-- Gallery Grid -->
      <div class="gallery-grid">
        <div class="gallery-item" onclick="openLightbox('1.jpg')">
          <img src="1.jpg" alt="Dude photo 1">
        </div>

        <div class="gallery-item" onclick="openLightbox('2.jpg')">
          <img src="2.jpg" alt="Dude photo 2">
        </div>

        <div class="gallery-item" onclick="openLightbox('3.jpg')">
          <img src="3.jpg" alt="Dude photo 3">
        </div>

        <div class="gallery-item" onclick="openLightbox('4.jpg')">
          <img src="4.jpg" alt="Dude photo 4">
        </div>

        <div class="gallery-item" onclick="openLightbox('5.jpg')">
          <img src="5.jpg" alt="Dude photo 5">
        </div>

        <div class="gallery-item" onclick="openLightbox('6.jpg')">
          <img src="6.jpg" alt="Dude photo 6">
        </div>

        <div class="gallery-item" onclick="openLightbox('7.jpg')">
          <img src="7.jpg" alt="Dude photo 7">
        </div>

        <div class="gallery-item" onclick="openLightbox('8.jpg')">
          <img src="8.jpg" alt="Dude photo 8">
        </div>

        <div class="gallery-item" onclick="openLightbox('9.jpg')">
          <img src="9.jpg" alt="Dude photo 9">
        </div>

        <div class="gallery-item" onclick="openLightbox('10.jpg')">
          <img src="10.jpg" alt="Dude photo 10">
        </div>

        <div class="gallery-item" onclick="openLightbox('11.jpg')">
          <img src="11.jpg" alt="Dude photo 11">
        </div>

        <div class="gallery-item" onclick="openLightbox('12.jpg')">
          <img src="12.jpg" alt="Dude photo 12">
        </div>

        <div class="gallery-item" onclick="openLightbox('13.jpg')">
          <img src="13.jpg" alt="Dude photo 13">
        </div>

        <div class="gallery-item" onclick="openLightbox('14.jpg')">
          <img src="14.jpg" alt="Dude photo 14">
        </div>

        <div class="gallery-item" onclick="openLightbox('stick.jpg')">
          <img src="stick.jpg" alt="Dude with stick">
        </div>

        <div class="gallery-item" onclick="openLightbox('flowers.jpg')">
          <img src="flowers.jpg" alt="Dude at memorial">
        </div>
      </div>

      <!-- Video Section -->
      <div class="content-card">
        <h2><i class="fas fa-video"></i> Videos</h2>
        <p>Watch Dude in action.</p>
      </div>

      <div class="card-grid" style="grid-template-columns: repeat(3, 1fr);">
        <div class="gallery-item" style="aspect-ratio: 16/9;" onclick="openVideoLightbox('Video.1.mp4')">
          <video muted>
            <source src="Video.1.mp4" type="video/mp4">
          </video>
          <i class="fas fa-play-circle play-icon"></i>
        </div>

        <div class="gallery-item" style="aspect-ratio: 16/9;" onclick="openVideoLightbox('Video.2.mp4')">
          <video muted>
            <source src="Video.2.mp4" type="video/mp4">
          </video>
          <i class="fas fa-play-circle play-icon"></i>
        </div>

        <div class="gallery-item" style="aspect-ratio: 16/9;" onclick="openVideoLightbox('Video.3.mp4')">
          <video muted>
            <source src="Video.3.mp4" type="video/mp4">
          </video>
          <i class="fas fa-play-circle play-icon"></i>
        </div>
      </div>

      <!-- Page Navigation -->
      <div class="page-nav">
        <a href="resources.html" class="page-nav-link">
          <i class="fas fa-arrow-left"></i> Previous: Resources
        </a>
        <a href="game.html" class="page-nav-link">
          Next: Game <i class="fas fa-arrow-right"></i>
        </a>
      </div>
    </div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close">&times;</button>
    <img src="" alt="Enlarged photo" class="lightbox-content" id="lightbox-img">
  </div>

  <!-- Video Lightbox -->
  <div class="lightbox" id="video-lightbox" onclick="closeVideoLightbox()">
    <button class="lightbox-close">&times;</button>
    <video controls class="lightbox-content" id="lightbox-video" style="max-width: 90%; max-height: 90%;">
      <source src="" type="video/mp4">
    </video>
  </div>

  <script>
    function toggleMenu() {
      document.getElementById('nav').classList.toggle('active');
    }

    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    function openVideoLightbox(src) {
      const video = document.getElementById('lightbox-video');
      video.querySelector('source').src = src;
      video.load();
      document.getElementById('video-lightbox').classList.add('active');
      video.play();
    }

    function closeVideoLightbox() {
      const video = document.getElementById('lightbox-video');
      video.pause();
      document.getElementById('video-lightbox').classList.remove('active');
    }

    // Close on Escape key
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeLightbox();
        closeVideoLightbox();
      }
    });
  </script>
</body>
</html>
