<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REAL DECK - Finiti Hybrid Quality</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;600;800&display=swap');

        :root {
            --rainbow: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-sub: #555555;
        }

        body {
            background: #e0e5ec;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* Photorealistic iPad Frame */
        .ipad-mockup {
            width: 768px;
            height: 1024px;
            background: #f0f0f0;
            border-radius: 50px;
            padding: 25px;
            box-shadow: 
                0 0 0 4px #c0c0c0, /* Silver edge */
                inset 0 0 0 2px #333, /* Inner black bezel line */
                20px 20px 60px #bebebe,
                -20px -20px 60px #ffffff;
            position: relative;
            border: 1px solid #d1d1d6;
            transform: scale(0.85); /* Scale down slightly to fit screen */
        }
        
        /* Reflection/Glass Effect */
        .ipad-mockup::after {
            content: "";
            position: absolute;
            top: 25px; right: 25px; bottom: 25px; left: 25px;
            border-radius: 32px;
            box-shadow: inset 10px 10px 40px rgba(255,255,255,0.2);
            pointer-events: none;
            z-index: 50;
        }

        .screen {
            width: 100%;
            height: 100%;
            background: url('ipadbackground.jpg') no-repeat center center;
            background-size: cover;
            border-radius: 32px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Status Bar */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            padding: 10px 28px 0;
            align-items: center;
            color: white;
            font-size: 14px;
            font-weight: 800;
            z-index: 20;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* App Container */
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        .header-text h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: 36px;
            font-weight: 900;
            background: var(--rainbow);
            background-size: 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow 10s linear infinite;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin: 0;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        @keyframes rainbow { 0% { background-position: 0 0; } 100% { background-position: 400% 0; } }

        .header-text p {
            text-align: center;
            font-size: 12px;
            color: white;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 5px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* 3D CARD ENGINE */
        .card-perspective {
            perspective: 1500px; 
            width: 600px;
            height: 450px;
            margin-top: 30px;
            position: relative;
            z-index: 20;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            transform-style: preserve-3d;
        }

        .card-perspective.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 35px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .card-front { z-index: 2; transform: rotateY(0deg); }
        .card-back {
            transform: rotateY(180deg);
            background: #ffffff;
            align-items: flex-start;
            text-align: left;
            z-index: 1;
        }

        /* Typography */
        .card-subtitle {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 42px;
            font-weight: 900;
            color: #111;
            line-height: 1.1;
        }

        .card-text {
            font-size: 16px;
            line-height: 1.5;
            color: #333;
            font-weight: 500;
        }

        .source-btn {
            margin-top: auto;
            display: inline-block;
            background: #f0f0f5;
            color: #007AFF;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 11px;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        .source-btn:hover {
            background: #007AFF;
            color: white;
            transform: translateY(-2px);
        }

        /* Navigation Controls - OIL COLOR */
        .controls {
            margin-top: 40px;
            display: flex;
            gap: 30px;
            align-items: flex-end;
            justify-content: center;
            z-index: 20;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: white;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .circle-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            /* UNICORN OIL GRADIENT */
            background: linear-gradient(135deg, #39ff14, #ffd700, #ff00ff, #00f3ff);
            background-size: 200% 200%;
            animation: oilShift 5s ease infinite;
            border: 3px solid white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        @keyframes oilShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .circle-btn:hover { transform: scale(1.1); }
        .circle-btn:active { transform: scale(0.95); }

        /* Center Button Bigger */
        .btn-flip {
            width: 95px;
            height: 95px;
            font-size: 36px;
        }
        
        /* View Management */
        .view { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; }
        .view.active { display: flex; }

        /* Dock */
        .dock {
            margin-top: auto;
            margin-bottom: 25px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(20px);
            padding: 15px 30px;
            border-radius: 40px;
            display: flex;
            gap: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            z-index: 20;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .dock-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: #888;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .dock-icon.active { background: #111; color: white; transform: translateY(-10px); }

        /* Visual Data Links */
        .info-list {
            width: 100%;
            max-height: 340px;
            overflow-y: auto;
            text-align: left;
            font-size: 14px;
        }
        .info-item {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .info-link {
            color: #007AFF;
            font-weight: 700;
            text-decoration: none;
            font-size: 12px;
            background: rgba(0,122,255,0.1);
            padding: 4px 8px;
            border-radius: 6px;
            transition: 0.2s;
        }
        .info-link:hover { background: #007AFF; color: white; }
        
        /* Game & AI Inputs */
        textarea {
            background: white;
            color: #111;
            border: 2px solid #eee;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.05);
        }
        .game-btn {
            background: rgba(255,255,255,0.9);
            border: 1px solid rgba(0,0,0,0.1);
            color: #333;
            font-weight: 700;
            padding: 15px;
            border-radius: 12px;
            transition: 0.2s;
            width: 100%;
            text-align: left;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .game-btn:hover { background: white; transform: translateY(-2px); }
        .game-btn.correct { background: #34C759; color: white; border-color: #34C759; }
        .game-btn.wrong { background: #FF3B30; color: white; border-color: #FF3B30; }

        .spinner {
            border: 3px solid rgba(0,0,0,0.1);
            width: 20px; height: 20px;
            border-radius: 50%;
            border-left-color: #007AFF;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="ipad-mockup" id="ipadFrame">
        <div class="screen">
            <div class="status-bar">
                <span>11:11am</span>
                <i class="fas fa-battery-full"></i>
            </div>

            <!-- APP 1: THE ARCHIVE -->
            <div id="view-deck" class="view active">
                <div class="header-text mt-10">
                    <h1>REAL DECK</h1>
                    <p>THE ARCHIVE v5.0</p>
                </div>

                <div class="card-perspective" id="cardBase">
                    <div class="card-inner">
                        <!-- FRONT -->
                        <div class="card-face card-front">
                            <div class="card-subtitle" id="front-sub">Speaker</div>
                            <div class="card-title" id="front-title">Title</div>
                        </div>
                        <!-- BACK -->
                        <div class="card-face card-back">
                            <div class="card-subtitle" id="back-sub" style="color: #007AFF;">Topic</div>
                            <div class="card-text" id="back-text">Content goes here.</div>
                            <a href="#" id="back-link" target="_blank" class="source-btn">Source Link</a>
                        </div>
                    </div>
                </div>

                <div class="controls">
                    <div class="nav-item">
                        <button class="circle-btn" onclick="prevCard()"><i class="fas fa-chevron-left"></i></button>
                        <span class="nav-label">Back</span>
                    </div>
                    <div class="nav-item">
                        <button class="circle-btn btn-flip" onclick="flipCard()"><i class="fas fa-sync-alt"></i></button>
                        <span class="nav-label">Flip</span>
                    </div>
                    <div class="nav-item">
                        <button class="circle-btn" onclick="nextCard()"><i class="fas fa-chevron-right"></i></button>
                        <span class="nav-label">Next</span>
                    </div>
                </div>
            </div>

            <!-- APP 2: THE GAUNTLET -->
            <div id="view-game" class="view">
                <div class="header-text mt-10">
                    <h1>THE GAUNTLET</h1>
                    <p>SURVIVAL MODE</p>
                </div>
                <div id="game-container" class="w-full max-w-md text-center mt-10 p-6 bg-white/80 backdrop-blur rounded-3xl shadow-2xl z-20 relative">
                    <h2 id="q-text" class="text-2xl font-bold text-gray-800 mb-6">Question?</h2>
                    <div id="q-opts" class="flex flex-col gap-3"></div>
                    <div id="q-feedback" class="mt-4 text-sm font-bold min-h-[20px]"></div>
                    <button onclick="generateQuestion()" class="mt-6 w-full bg-black hover:bg-gray-800 text-white font-bold py-3 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                        <i class="fas fa-magic"></i> Generate New Question
                    </button>
                </div>
                <div id="game-win" class="hidden text-center mt-20 z-20 relative">
                    <h1 class="text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-500 to-red-500 animate-pulse">BAM!</h1>
                    <p class="text-white text-xl font-bold mt-4 drop-shadow-md">🌈 UNICORN STATUS UNLOCKED 🌈</p>
                </div>
            </div>

            <!-- APP 3: THE ORACLE -->
            <div id="view-ai" class="view">
                <div class="header-text mt-10">
                    <h1>THE ORACLE</h1>
                    <p>STRATEGY LAB</p>
                </div>
                <div class="w-full max-w-md mt-6 bg-white/90 backdrop-blur p-6 rounded-3xl shadow-2xl z-20 relative">
                    <textarea id="ai-input" rows="4" placeholder="Type your communication scenario here..." class="w-full p-4 rounded-xl text-lg font-medium outline-none focus:ring-2 ring-blue-400"></textarea>
                    <div class="flex gap-3 mt-4">
                        <button onclick="runAI()" class="flex-1 bg-black text-white font-bold py-3 rounded-xl hover:bg-gray-800 transition flex items-center justify-center gap-2">
                             ✨ Generate Strategy
                        </button>
                        <button onclick="resetAI()" class="px-4 bg-gray-200 text-gray-600 font-bold rounded-xl hover:bg-gray-300 transition"><i class="fas fa-redo"></i></button>
                    </div>
                    <div id="ai-output" class="hidden mt-4 p-4 bg-blue-50 rounded-xl border-l-4 border-blue-500 text-blue-900 text-sm"></div>
                </div>
            </div>

            <div class="dock">
                <div class="dock-icon active" onclick="switchTab('deck')" title="The Archive"><i class="fas fa-layer-group"></i></div>
                <div class="dock-icon" onclick="switchTab('game')" title="The Gauntlet"><i class="fas fa-bolt"></i></div>
                <div class="dock-icon" onclick="switchTab('ai')" title="The Oracle"><i class="fas fa-brain"></i></div>
            </div>

        </div>
    </div>

    <script>
        const apiKey = ""; // API Key injected by environment

        /* --- CARD DATA --- */
        const deck = [
            {
                sub: "Simon Sinek",
                title: "Sinek’s “WHY”", 
                backSub: "Start with WHY & The Infinite Game",
                text: "<strong>Start with WHY:</strong> Lead with why the issue matters before details. A one‑line “why” makes people more likely to read/respond.<br><br><strong>Infinite Game:</strong> Focus on long‑term trust instead of winning one argument. Choose collaboration over “being right”.",
                link: "https://www.youtube.com/watch?v=qpnNsSyDw-g"
            },
            {
                sub: "Tech Writing Standard",
                title: "BLUF",
                backSub: "Bottom Line Up Front",
                text: "Put the main request or conclusion in the first sentence. Busy readers scan; they decide in seconds whether to keep reading. Lead with: “Bottom line: …” and then support it.",
                link: "https://en.wikipedia.org/wiki/BLUF_(communication)"
            },
            {
                sub: "Audience Analysis",
                title: "Audience First",
                backSub: "Clear & Neutral",
                text: "Technical tone must be clear, neutral, and efficient because the primary audience is solving a problem, not reading for fun. Ask: “What does my reader need to do in the next 30 seconds?”",
                link: "https://owl.purdue.edu/owl/subject_specific_writing/professional_technical_writing/audience_analysis/index.html"
            },
            {
                sub: "Celeste Headlee",
                title: "Headlee’s Rules",
                backSub: "Conversation Protocol",
                text: "<strong>Open-Ended Questions:</strong> Ask 'How/Why' to invite stories, not yes/no.<br><strong>Don't Equate:</strong> Hijacking their story is not empathy.<br><strong>Honesty:</strong> If you don't know, say so. Bluffing kills trust.",
                link: "https://www.ted.com/talks/celeste_headlee_10_ways_to_have_a_better_conversation"
            },
            {
                sub: "Jia Jiang",
                title: "Rejection Therapy",
                backSub: "Rewire & Engage",
                text: "<strong>Rewire:</strong> Repeatedly asking makes 'No' feel like data, not danger.<br><strong>Stay Engaged:</strong> Don't run. Asking 'Why?' often reveals the rejection was logistical, not personal.",
                link: "https://www.ted.com/talks/jia_jiang_what_i_learned_from_100_days_of_rejection"
            },
            {
                sub: "Visual Data",
                title: "10 Types of Infographics",
                backSub: "Visual Reference",
                text: `<div class="info-list">
                    <div class="info-item">Timeline <a href="https://venngage.com/blog/timeline-examples/" target="_blank" class="info-link">Example</a></div>
                    <div class="info-item">Process <a href="https://visme.co/blog/process-infographic/" target="_blank" class="info-link">Example</a></div>
                    <div class="info-item">Comparison <a href="https://www.canva.com/graphs/comparison-charts/" target="_blank" class="info-link">Example</a></div>
                    <div class="info-item">Informational <a href="https://piktochart.com/blog/informational-infographic-examples/" target="_blank" class="info-link">Example</a></div>
                    <div class="info-item">Statistical <a href="https://blog.hubspot.com/marketing/great-data-visualization-examples" target="_blank" class="info-link">Example</a></div>
                    <div class="info-item">Location <a href="https://www.adobe.com/express/discover/templates/map" target="_blank" class="info-link">Example</a></div>
                    <div class="info-item">Flowchart <a href="https://www.lucidchart.com/pages/templates/flowchart" target="_blank" class="info-link">Example</a></div>
                    <div class="info-item">List <a href="https://www.easelly.com/blog/list-infographic-templates/" target="_blank" class="info-link">Example</a></div>
                    <div class="info-item">Resume <a href="https://zety.com/blog/infographic-resume-templates" target="_blank" class="info-link">Example</a></div>
                    <div class="info-item">Interactive <a href="https://shorthand.com/the-craft/interactive-infographics/" target="_blank" class="info-link">Example</a></div>
                </div>`,
                link: "#"
            }
        ];

        /* --- STATE --- */
        let idx = 0;
        let gameIdx = 0;
        let questions = [
            { q: "What is the goal of the Infinite Game?", opts: ["Winning", "Perpetuating play", "Destroying rivals"], a: 1 },
            { q: "BLUF stands for:", opts: ["Big Long Ugly Font", "Bottom Line Up Front", "Basic Line User Format"], a: 1 },
            { q: "Headlee says equating experiences is:", opts: ["Empathy", "Hijacking", "Listening"], a: 1 }
        ];

        /* --- API CALLER --- */
        async function callGemini(prompt, isJson = false) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const body = {
                contents: [{ parts: [{ text: prompt }] }]
            };
            if (isJson) {
                body.generationConfig = { responseMimeType: "application/json" };
            }

            for (let i = 0; i < 3; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    if (!response.ok) throw new Error(`Error: ${response.status}`);
                    const data = await response.json();
                    const text = data.candidates[0].content.parts[0].text;
                    return isJson ? JSON.parse(text) : text;
                } catch (e) {
                    console.error("API Attempt failed", e);
                    await new Promise(r => setTimeout(r, 1000 * Math.pow(2, i)));
                }
            }
            return null;
        }

        /* --- RENDER --- */
        function render() {
            const c = deck[idx];
            document.getElementById('front-sub').innerText = c.sub;
            document.getElementById('front-title').innerText = c.title;
            
            document.getElementById('back-sub').innerText = c.backSub;
            document.getElementById('back-text').innerHTML = c.text;
            
            const lnk = document.getElementById('back-link');
            if(c.link !== "#") {
                lnk.href = c.link;
                lnk.style.display = "inline-block";
                lnk.innerText = "View Source";
            } else {
                lnk.style.display = "none";
            }

            document.getElementById('cardBase').classList.remove('flipped');
        }

        function flipCard() { document.getElementById('cardBase').classList.toggle('flipped'); }
        function nextCard() { idx = (idx + 1) % deck.length; render(); }
        function prevCard() { idx = (idx - 1 + deck.length) % deck.length; render(); }

        /* --- VIEW SWITCH --- */
        function switchTab(tab) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(`view-${tab}`).classList.add('active');
            
            document.querySelectorAll('.dock-icon').forEach(i => i.classList.remove('active'));
            event.currentTarget.classList.add('active');
            if(tab === 'game') renderGame();
        }

        /* --- GAME LOGIC --- */
        function renderGame() {
            if(gameIdx >= questions.length) {
                document.getElementById('game-container').style.display = 'none';
                document.getElementById('game-win').classList.remove('hidden');
                
                // UNICORN MODE
                var end = Date.now() + (3 * 1000);
                (function frame() {
                    confetti({ particleCount: 10, angle: 60, spread: 80, origin: { x: 0 }, colors: ['#00f3ff', '#ff00ff', '#ffd700'] });
                    confetti({ particleCount: 10, angle: 120, spread: 80, origin: { x: 1 }, colors: ['#00f3ff', '#ff00ff', '#ffd700'] });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
                return;
            }
            
            const q = questions[gameIdx];
            document.getElementById('q-text').innerText = q.q;
            document.getElementById('q-feedback').innerText = ""; 
            const div = document.getElementById('q-opts');
            div.innerHTML = '';
            
            q.opts.forEach((o, i) => {
                const b = document.createElement('button');
                b.className = "game-btn";
                b.innerText = o;
                b.onclick = () => {
                    if (i === q.a) {
                        b.classList.add('correct');
                        document.getElementById('q-feedback').innerText = "CORRECT! Next question coming...";
                        document.getElementById('q-feedback').style.color = "#34C759";
                        setTimeout(() => {
                            gameIdx++;
                            renderGame();
                        }, 1000);
                    } else {
                        b.classList.add('wrong');
                        document.getElementById('q-feedback').innerText = "WRONG! Try again.";
                        document.getElementById('q-feedback').style.color = "#FF3B30";
                    }
                };
                div.appendChild(b);
            });
        }

        async function generateQuestion() {
            const feedback = document.getElementById('q-feedback');
            feedback.innerText = "Generating new question... ✨";
            feedback.style.color = "#00f3ff";

            const prompt = `Generate a multiple choice trivia question about communication skills, leadership, or negotiation strategies (similar to Simon Sinek or Celeste Headlee). Output strictly valid JSON: { "q": "question text", "opts": ["opt1", "opt2", "opt3"], "a": index_of_correct_answer_integer }`;
            
            const newQ = await callGemini(prompt, true);
            if (newQ) {
                questions.push(newQ);
                alert("New question added to the gauntlet! Keep playing.");
                renderGame();
                feedback.innerText = "";
            } else {
                feedback.innerText = "Failed to generate. Try again.";
            }
        }

        /* --- AI COACH LOGIC --- */
        async function runAI() {
            const txt = document.getElementById('ai-input').value;
            const out = document.getElementById('ai-output');
            
            if(txt.length < 1) {
                out.classList.remove('hidden');
                out.innerHTML = "Please type a scenario first.";
                return;
            }

            out.classList.remove('hidden');
            out.innerHTML = `<div class="spinner"></div> Analyzing strategy...`;

            const prompt = `Act as a communication strategy coach (like Simon Sinek and Celeste Headlee). Analyze this user scenario: "${txt}". Provide 1 critique and 1 specific winning strategy script. Keep it short and punchy. HTML format with bolding.`;
            
            const response = await callGemini(prompt);
            if (response) {
                out.innerHTML = response;
            } else {
                out.innerHTML = "Connection error. Please try again.";
            }
        }

        function resetAI() {
            document.getElementById('ai-input').value = "";
            document.getElementById('ai-output').classList.add('hidden');
        }

        render();
    </script>
</body>
</html>
