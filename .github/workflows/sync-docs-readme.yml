# Sync docs/area-155-overview.md -> README.md on every docs change
name: Sync README from docs

on:
  push:
    paths:
      - 'docs/**'
      - '.github/workflows/sync-docs-readme.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy docs file to README.md
        run: |
          if [ -f docs/area-155-overview.md ]; then
            cp docs/area-155-overview.md README.md
          else
            echo "docs/area-155-overview.md not found" && exit 1
          fi

      - name: Commit and push README.md if changed
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions
          author_email: actions@github.com
          message: "ci: sync README.md from docs/area-155-overview.md"
          add: "README.md"
